name: Check if Forge 1.7.10 builds

on:
  push:
    branches: [ "FG_1.2" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_REPO: https://github.com/MinecraftForge/MinecraftForge.git
  FORGE_BRANCH: '1.7.10'
  FORGE_COMMIT: 9274e4fe435cb415099a8216c1b42235f185443e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build ForgeGradle
        run: ./gradlew build install

      - name: Find the ForgeGradle version
        run: |
          echo "FG_VERSION=$(./gradlew -q properties | sed -n 's/^version: //p')" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ForgeGradle
          path: build/libs/

      - name: Checkout Forge 1.7.10
        run: |
          git clone --filter=blob:none --single-branch -b "$FORGE_BRANCH" "$FORGE_REPO" forge
          git -C forge checkout -B "$FORGE_BRANCH" "$FORGE_COMMIT"

      - name: Build Forge 1.7.10
        working-directory: forge
        env:
          BUILD_NUMBER: 1614
        # Skips launch4j
        run: >-
          ./gradlew --init-script ../.github/ci/use-local-fg.gradle
          setupForge build -x downloadL4J -x extractL4J -x generateXmlConfig -x createExe -x launch4j

      - name: Check the Forge 1.7.10 outputs
        working-directory: forge/build/distributions
        run: |
          ls -l
          for kind in universal installer userdev src; do
            ls forge-1.7.10-*-"$kind".* > /dev/null || { echo "::error::Missing the Forge $kind output"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Forge-1.7.10
          path: forge/build/distributions/
