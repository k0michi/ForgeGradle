name: Check if Forge builds

on:
  push:
    branches: [ "FG_1.2" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_REPO: https://github.com/MinecraftForge/MinecraftForge.git

jobs:
  build:
    name: Forge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.7.10'
            branch: '1.7.10'
            commit: c6aa04325e8a80af88755adb2339a402e7e90ebb
            build: 1614
          - mc: '1.7.2'
            branch: mc172
            commit: e08c63b57bc51bb9f4fda335457a61c8d561aea1
            build: 1161
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build ForgeGradle
        run: ./gradlew build install

      - name: Find the ForgeGradle version
        run: |
          echo "FG_VERSION=$(./gradlew -q properties | sed -n 's/^version: //p')" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: matrix.mc == '1.7.10'
        with:
          name: ForgeGradle
          path: build/libs/

      - name: Checkout Forge ${{ matrix.mc }}
        run: |
          git clone --filter=blob:none --single-branch -b "${{ matrix.branch }}" "$FORGE_REPO" forge
          git -C forge checkout -B "${{ matrix.branch }}" "${{ matrix.commit }}"
          git -C forge submodule update --init --filter=blob:none

      - name: Build Forge ${{ matrix.mc }}
        working-directory: forge
        env:
          BUILD_NUMBER: ${{ matrix.build }}
        # Use Gradle from ForgeGradle
        # Skips launch4j
        run: >-
          ../gradlew --init-script ../.github/ci/use-local-fg.gradle
          setupForge ciWriteBuildNumber build -x downloadL4J -x extractL4J -x generateXmlConfig -x createExe -x launch4j

      - name: Check the Forge ${{ matrix.mc }} outputs
        working-directory: forge/build/distributions
        run: |
          ls -l
          for kind in universal installer userdev src; do
            ls forge-${{ matrix.mc }}-*-"$kind".* > /dev/null || { echo "::error::Missing the Forge $kind output"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Forge-${{ matrix.mc }}
          path: forge/build/distributions/
